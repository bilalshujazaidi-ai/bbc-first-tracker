name: Daily BBC First scrape

on:
  schedule:
    # Every 30 minutes, all day. GitHub's cron trigger is "best effort" and
    # occasionally skips a firing entirely (this happened once already) —
    # rather than depend on one exact time, this gives today's scrape ~48
    # chances to land. scrape.py checks first and does nothing once a run
    # has already succeeded today, so this costs almost nothing: most of
    # these firings finish in under a second. The repo is public, so
    # GitHub Actions minutes are free/unlimited here regardless.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scraper with retries
        env:
          SUPABASE_URL: https://vpgiavduczlqvfcigmdg.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 "$GITHUB_WORKSPACE/scripts/scrape.py"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "All attempts failed."
          exit 1
