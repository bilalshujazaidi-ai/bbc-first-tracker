name: Daily BBC First scrape

on:
  schedule:
    # First attempt at 09:00 UTC = 10:00am UK during BST (summer). When UK
    # clocks go back to GMT in late October this becomes 9:00am UK — a
    # one-hour shift; adjust the hour below then if you want it pinned to
    # 10am year-round.
    #
    # Then every 30 minutes for the rest of the day as retries: GitHub's
    # cron trigger is "best effort" and occasionally skips a firing
    # entirely (this happened once already), so rather than depend on one
    # exact time succeeding, this gives today's scrape ~30 chances to land
    # between 10am and midnight. scrape.py checks first and does nothing
    # once a run has already succeeded today, so this costs almost nothing
    # — every firing after the first success finishes in under a second.
    # The repo is public, so GitHub Actions minutes are free/unlimited here
    # regardless.
    - cron: "0,30 9-23 * * *"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scraper with retries
        env:
          SUPABASE_URL: https://vpgiavduczlqvfcigmdg.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 "$GITHUB_WORKSPACE/scripts/scrape.py"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          echo "All attempts failed."
          exit 1
